# Configuración de Air para recarga en caliente (Hot Reload)
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "./tmp/main.exe"
  full_bin = "./tmp/main.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
  exclude_dir = ["bin", "tmp", "docs", "migrations", ".git", ".agent", ".github", ".gemini"]
  include_dir = []
  include_file = []
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = true
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500
  args_bin = []

[log]
  time = false
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
