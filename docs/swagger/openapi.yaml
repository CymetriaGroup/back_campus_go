openapi: 3.0.3
info:
  title: Hexagonal Go API Template
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        "200":
          description: Process is alive
  /ready:
    get:
      responses:
        "200":
          description: Application is ready
  /api/v1/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Token pair
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      responses:
        "200":
          description: Rotated token pair
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Paginated users
        "403":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
        "404":
          $ref: "#/components/responses/Error"
    put:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User updated
    delete:
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC token
  schemas:
    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
  responses:
    Error:
      description: Standard API error
