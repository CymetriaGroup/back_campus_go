services:
  api:
    build: .
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      JWT_SECRET: local-only-secret-change-in-production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: "25"
      DATABASE_MAX_IDLE_CONNS: "5"
      DATABASE_CONN_MAX_LIFETIME: 30m
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d app"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  postgres_data:
